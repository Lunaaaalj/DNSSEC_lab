// alpha/named.conf
options {
    directory "/var/cache/bind";
    pid-file "/var/cache/bind/alpha.pid";
    listen-on { 172.30.0.30; };
    listen-on-v6 { none; };
    recursion no;
    allow-query { any; };
};
zone "alpha.unsigned" {
    type primary;
    file "/etc/bind/dns-lab/alpha/zones/db.alpha.unsigned";
};
controls { };
