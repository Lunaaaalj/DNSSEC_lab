// root/named.conf
options {
    directory "/var/cache/bind";
    pid-file "/run/named-root.pid";
    listen-on { 172.30.0.10; };
    listen-on-v6 { none; };
    recursion no;
    allow-query { any; };
};
zone "." {
    type primary;
    file "/etc/bind/dns-lab/root/zones/db.root";
};
controls { };
