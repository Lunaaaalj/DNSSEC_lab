// recursive2/named.conf  -- validating resolver (trust anchor = private root KSK)
options {
    directory "/var/cache/bind";
    pid-file "/var/cache/bind/recursive2.pid";
    listen-on { 172.30.0.200; };
    listen-on-v6 { none; };
    recursion yes;
    allow-recursion { 127.0.0.1; 172.30.0.0/24; };
    allow-query { 127.0.0.1; 172.30.0.0/24; };
    dnssec-validation yes;   // "yes" = use only the anchors below (not "auto")
};
include "/etc/bind/dns-lab/recursive2/trust-anchor.conf";
zone "." {
    type hint;
    file "/etc/bind/dns-lab/recursive2/zones/db.root.hints";
};
controls { };
