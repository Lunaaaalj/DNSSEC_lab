// signed/named.conf
options {
    directory "/var/cache/bind";
    pid-file "/var/cache/bind/signed.pid";
    listen-on { 172.30.0.40; };
    listen-on-v6 { none; };
    recursion no;
    allow-query { any; };
};
zone "signed" {
    type primary;
    file "/etc/bind/dns-lab/signed/zones/db.signed.signed";
};
controls { };
