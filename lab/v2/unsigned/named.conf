// unsigned/named.conf
options {
    directory "/var/cache/bind";
    pid-file "/var/cache/bind/unsigned.pid";
    listen-on { 172.30.0.20; };
    listen-on-v6 { none; };
    recursion no;
    allow-query { any; };
};
zone "unsigned" {
    type primary;
    file "/etc/bind/dns-lab/unsigned/zones/db.unsigned";
};
controls { };
