// gamma/named.conf
options {
    directory "/var/cache/bind";
    pid-file "/var/cache/bind/gamma.pid";
    listen-on { 172.30.0.60; };
    listen-on-v6 { none; };
    recursion no;
    allow-query { any; };
};
zone "gamma.signed" {
    type primary;
    file "/etc/bind/dns-lab/gamma/zones/db.gamma.signed";
};
controls { };
