// beta/named.conf
options {
    directory "/var/cache/bind";
    pid-file "/var/cache/bind/beta.pid";
    listen-on { 172.30.0.50; };
    listen-on-v6 { none; };
    recursion no;
    allow-query { any; };
};
zone "beta.signed" {
    type primary;
    file "/etc/bind/dns-lab/beta/zones/db.beta.signed.signed";
};
controls { };
