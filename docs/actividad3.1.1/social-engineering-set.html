<style>
/* Shared chassis: stage, slide on/off, stepped reveals, notes. Styles own colour, type and chrome. */
html,body{margin:0;height:100%;overflow:hidden}
#stage{position:fixed;left:50%;top:50%;width:min(100vw,177.78vh);aspect-ratio:16/9;transform:translate(-50%,-50%);container-type:inline-size;overflow:hidden}
#ascii{position:absolute;inset:0;width:100%;height:100%;display:block}
.slide{position:absolute;inset:0;opacity:0;pointer-events:none;filter:blur(.3cqw);transition:opacity .55s cubic-bezier(.16,1,.3,1),filter .55s cubic-bezier(.16,1,.3,1)}
.slide.on{opacity:1;pointer-events:auto;filter:none}
/* incoming slide: children rise in a short stagger; outgoing slide fades and softens */
.slide.on>*{animation:rise .8s cubic-bezier(.16,1,.3,1) both}
.slide.on>*:nth-child(2){animation-delay:.07s}.slide.on>*:nth-child(3){animation-delay:.14s}
.slide.on>*:nth-child(4){animation-delay:.21s}.slide.on>*:nth-child(5){animation-delay:.28s}.slide.on>*:nth-child(n+6){animation-delay:.34s}
@keyframes rise{from{opacity:0;translate:0 1cqw}}
.slide h1,.slide h2,.slide p,.slide ol,.slide ul{margin:0;padding:0}
.slide ol,.slide ul{list-style:none}
[data-at],[data-only]{opacity:0;translate:0 .5cqw;transition:opacity .45s cubic-bezier(.16,1,.3,1),translate .45s cubic-bezier(.16,1,.3,1);pointer-events:none}
[data-at].shown,[data-only].shown{translate:0 0}
[data-at].shown,[data-only].shown{opacity:1;pointer-events:auto}
.v-on{display:none}body[data-verify="on"] .v-on{display:block}body[data-verify="on"] .v-off{display:none}
#verify{font:inherit;cursor:pointer}
#notes{position:fixed;left:50%;bottom:0;transform:translate(-50%,100%);width:min(900px,96vw);padding:14px 18px;background:#000d;color:#fff;font:15px/1.5 system-ui,sans-serif;transition:transform .3s;z-index:9;border-radius:8px 8px 0 0}
#notes.open{transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.slide,[data-at],[data-only]{transition:none;filter:none}.slide.on>*{animation:none}}

</style>
<style>
:root{--bg:#0b0c0d;--ink:#e6e8e3;--mid:#9ea29c;--dim:#83877f;--line:#e6e8e32e;--line2:#e6e8e35c;--amb:#ffb000}
body{background:#050506;color:var(--ink);font-family:"Geist Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
#stage{background:var(--bg)}
::selection{background:var(--ink);color:var(--bg)}
:focus-visible{outline:.15cqw solid var(--ink);outline-offset:.3cqw}

/* ── HUD chrome ── */
#hud{position:absolute;inset:0;pointer-events:none;z-index:4;font-size:1.05cqw;letter-spacing:.06em;text-transform:uppercase;color:var(--mid)}
.frame{position:absolute;inset:1.6cqw;border:.07cqw solid var(--line)}
.cn{position:absolute;width:2.6cqw;height:2.6cqw;border:0 solid var(--ink)}
.cn.tl{left:1.6cqw;top:1.6cqw;border-width:.16cqw 0 0 .16cqw}.cn.tr{right:1.6cqw;top:1.6cqw;border-width:.16cqw .16cqw 0 0}
.cn.bl{left:1.6cqw;bottom:1.6cqw;border-width:0 0 .16cqw .16cqw}.cn.br{right:1.6cqw;bottom:1.6cqw;border-width:0 .16cqw .16cqw 0}
.ro{position:absolute;left:4.5cqw;right:4.5cqw;display:flex;justify-content:space-between;gap:2cqw}
.ro.top{top:2.5cqw}.ro.bot{bottom:2.4cqw}
.ro b{font-weight:500;color:var(--ink)}
.live{color:var(--ink)}.live::before{content:"";display:inline-block;width:.6cqw;height:.6cqw;border-radius:50%;background:var(--amb);margin-right:.7cqw;vertical-align:.05cqw;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.ruler{position:absolute;top:8cqw;bottom:8cqw;width:1cqw;background:repeating-linear-gradient(180deg,var(--line2) 0 .07cqw,transparent .07cqw 1.2cqw),repeating-linear-gradient(180deg,var(--ink) 0 .1cqw,transparent .1cqw 6cqw)}
.ruler.l{left:1.6cqw;background-size:.55cqw 100%,1cqw 100%;background-repeat:no-repeat}
.ruler.r{right:1.6cqw;background-size:.55cqw 100%,1cqw 100%;background-repeat:no-repeat;background-position:right top,right top}
.ret{position:absolute;left:47cqw;right:4.5cqw;top:7.2cqw;bottom:6.6cqw;transition:left .55s cubic-bezier(.16,1,.3,1)}
body[data-slide="5"] .ret{left:65cqw}
.ret i{position:absolute;width:1.4cqw;height:1.4cqw;border:0 solid var(--line2)}
.ret i:nth-child(1){left:0;top:0;border-width:.1cqw 0 0 .1cqw}.ret i:nth-child(2){right:0;top:0;border-width:.1cqw .1cqw 0 0}
.ret i:nth-child(3){left:0;bottom:0;border-width:0 0 .1cqw .1cqw}.ret i:nth-child(4){right:0;bottom:0;border-width:0 .1cqw .1cqw 0}
.ret .lab{position:absolute;left:2cqw;top:-.55cqw;background:var(--bg);padding:0 .6cqw;color:var(--dim)}
.ret .scan{position:absolute;left:0;right:0;height:.07cqw;background:linear-gradient(90deg,transparent,var(--line2) 20%,var(--line2) 80%,transparent);animation:scan 7s linear infinite}
@keyframes scan{from{top:0}to{top:100%}}
.ret .xh{position:absolute;left:50%;top:50%;width:1.6cqw;height:1.6cqw;translate:-50% -50%;background:linear-gradient(var(--line2),var(--line2)) center/100% .07cqw no-repeat,linear-gradient(var(--line2),var(--line2)) center/.07cqw 100% no-repeat}
.meter{position:absolute;left:4.5cqw;bottom:5.2cqw;width:37cqw;height:.3cqw;display:flex;gap:.4cqw}
.meter span{flex:1;background:var(--line);transition:background .4s}.meter span.on{background:var(--ink)}

/* ── shared slide content ── */
.cmd{position:absolute;left:4.5cqw;top:6.4cqw;font-size:1.15cqw;letter-spacing:.06em;color:var(--dim);text-transform:uppercase}
.cmd::before{content:"cmd ";color:var(--mid)}.cmd::after{content:"_";color:var(--amb);animation:pulse 1.1s steps(1) infinite}
.hd{position:absolute;left:4.5cqw;top:9.6cqw;width:38cqw;font:500 3.3cqw/1.02 "Geist Mono",monospace;text-transform:uppercase;letter-spacing:-.04em;text-wrap:balance}
.seal{position:absolute;left:4.5cqw;bottom:7cqw;font-size:1cqw;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);max-width:40cqw}

/* cover */
.s-cover h1{position:absolute;left:4.5cqw;top:10.4cqw;font:500 4.9cqw/.94 "Geist Mono",monospace;text-transform:uppercase;letter-spacing:-.045em}
.s-cover .sub{position:absolute;left:4.5cqw;top:25.4cqw;width:36cqw;font:300 1.6cqw/1.45 "Geist Mono",monospace;color:var(--mid)}
.s-cover .foot{position:absolute;left:4.5cqw;bottom:7cqw;width:38cqw;line-height:1.5;font-size:1cqw;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.team{position:absolute;left:4.5cqw;bottom:12.6cqw;width:36cqw;display:grid;border-top:.07cqw solid var(--line2)}
.s-cover .foot span{display:block;margin-bottom:.3cqw;font-size:1.15cqw;color:var(--ink)}
.team li{display:flex;justify-content:space-between;gap:2cqw;padding:.42cqw 0;border-bottom:.07cqw solid var(--line);font:300 1.22cqw/1.2 "Geist Mono",monospace;color:var(--ink)}
.team i{font:400 1.12cqw/1.2 "Geist Mono",monospace;font-style:normal;letter-spacing:.06em;color:var(--mid)}

/* method — phase list */
.keys{position:absolute;left:4.5cqw;top:20cqw;width:37cqw;display:grid;font-size:1.45cqw;letter-spacing:.04em;text-transform:uppercase}

<script>
/* ASCII scene renderer + deck engine shared by every terminal prototype.
   Scenes are signed-distance drawings sampled per character cell, so the same
   animation renders as phosphor, ANSI blocks or typewriter ink depending on
   the style's ramp and colour function. All story content is synthetic. */
(function () {
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const TAU = Math.PI * 2, cl = (v, a = 0, b = 1) => v < a ? a : v > b ? b : v, fr = x => x - Math.floor(x);
  const hash = (x, y) => fr(Math.sin(x * 127.1 + y * 311.7) * 43758.5453);
  const sdC = (x, y, cx, cy, r) => Math.hypot(x - cx, y - cy) - r;
  const sdB = (x, y, cx, cy, bx, by, r = 0) => { const qx = Math.abs(x - cx) - bx + r, qy = Math.abs(y - cy) - by + r; return Math.hypot(Math.max(qx, 0), Math.max(qy, 0)) + Math.min(Math.max(qx, qy), 0) - r; };
  const sdS = (x, y, ax, ay, bx, by) => { const px = x - ax, py = y - ay, dx = bx - ax, dy = by - ay, h = cl((px * dx + py * dy) / (dx * dx + dy * dy)); return Math.hypot(px - dx * h, py - dy * h); };
  const smin = (a, b, k) => { const h = cl(.5 + .5 * (b - a) / k); return b * (1 - h) + a * h - k * h * (1 - h); };
  const ease = u => 1 - Math.pow(1 - cl(u), 3);
  // outline strong, interior textured
  const ink = (d, x, y, t, fill = .3, e = .035) => d > e ? 0 : d > -e ? 1 - Math.abs(d) / e * .35 : fill * (.55 + .45 * Math.sin(x * 23 + y * 17 + t * 2.2));
  const GLY = '#$%&*+=?@ABCDEFGHJKLMNPQRSTUVWXYZ0123456789';
  const decode = (s, t, t0) => s.split('').map((c, k) => (c === ' ' || t > t0 + k * .035) ? c : GLY[Math.floor(hash(k, Math.floor(t * 20)) * GLY.length)]).join('');

  function bust(x, y, cx, cy, s) {
    const head = sdC(x, y, cx, cy - .38 * s, .26 * s), body = sdB(x, y, cx, cy + .62 * s, .62 * s, .36 * s, .3 * s);
    return smin(head, body, .12 * s);
  }
  function lock(x, y, cx, cy, o) { // o: 0 closed → 1 open
    const body = sdB(x, y, cx, cy + .16, .27, .21, .04), lift = o * .2, top = cy - .07 - lift;
    const ring = Math.abs(sdC(x, y, cx, top, .17)) - .035, arc = y < top ? ring : 1;
    const legL = sdS(x, y, cx - .17, top, cx - .17, cy - .04) - .035;
    const legR = sdS(x, y, cx + .17, top, cx + .17, cy - .04 - lift) - .035;
    const kh = Math.min(sdC(x, y, cx, cy + .12, .045), sdB(x, y, cx, cy + .21, .018, .06));
    return { d: Math.max(Math.min(body, arc, legL, legR), -kh), kh };
  }

  const SCENES = {
    idle(x, y, t, i, j) { return hash(i, j + Math.floor(t * 3)) > .992 ? .5 : 0; },

    cover(x, y, t, i, j) {
      const kh = Math.min(sdC(x, y, 0, .42, .075), sdB(x, y, 0, .58, .035, .12));
      let d = Math.max(bust(x, y, 0, 0, 1), -kh), v = ink(d, x, y, t, .32);
      if (Math.abs(kh) < .03) v = -1;
      if (!v || hash(i, j) > t / 1.6) return 0;

    recon(x, y, t) {

    },
    reconStamps(t) { const sweep = (t * 1.3) % TAU; return RECON.map(([px, py, s]) => { const since = ((sweep - Math.atan2(py, px)) % TAU + TAU) % TAU; return { s, x: px, y: py + .11, acc: since < 2.4 }; }); },

    pretext(x, y, t) {
      const sx = reduced ? 1 : Math.max(.04, ease(t * 1.1)), X = x / sx;
      let d = Math.max(sdB(X, y, 0, .05, .48, .82, .06), -sdB(X, y, 0, -.66, .11, .025, .02));
      let v = ink(d, X, y, t, .12);
      const frame = Math.abs(sdB(X, y, 0, -.22, .26, .26)) - .012, b = bust(X, y, 0, -.18, .32);
      if (sdB(X, y, 0, -.22, .26, .26) < 0) v = Math.max(v, ink(b, X, y, t, .55));
      if (frame < 0) v = .6;
      return v;
    },
    pretextStamps(t) { return [{ s: decode('IT HELP DESK', t, .9), x: 0, y: .2, acc: 1 }, { s: decode('J. MARCOS', t, 1.2), x: 0, y: .36 }, { s: decode('ACCESS: ALL AREAS', t, 1.5), x: 0, y: .52 }]; },

    contact(x, y, t, i, j) {
      const P = 3.4, u = (t % P) / P, ex = -1.0 + u * 1.75, ey = -.1 - Math.sin(u * Math.PI) * .32;
      let v = 0;

      if (Math.abs(env) < .025) v = 1; else if (env < 0) v = .15;
      if (sdS(x, y, ex - .19, ey - .12, ex, ey + .03) < .018 || sdS(x, y, ex + .19, ey - .12, ex, ey + .03) < .018) v = 1;
      const s = (x + 1.0) / 1.75;
      if (s < u && s > u - .4 && env > .03) { const py = -.1 - Math.sin(s * Math.PI) * .32; if (Math.abs(y - py) < .02 && hash(i, 3) > .35) v = Math.max(v, .45 * (1 - (u - s) / .4)); }

      if (tgt) v = Math.max(v, u > .93 ? -tgt : tgt);
      return v;
    },
    contactStamps(t) { const u = (t % 3.4) / 3.4; return [{ s: '@', x: -1.0 + u * 1.75, y: -.1 - Math.sin(u * Math.PI) * .32 - .01, acc: 1 }, { s: 'accounts payable', x: .92, y: .55, acc: u > .93 }]; },

    exploit(x, y, t) {
      const o = ease((t - 1.7) / .5), L = lock(x, y, .52, 0, o);
      let v = ink(L.d, x, y, t, .3);
      if (Math.abs(L.kh) < .02) v = -1;
      const kx = -.95 + ease(t / 1.6) * .85, ky = .12;
      const key = Math.min(Math.abs(sdC(x, y, kx, ky, .12)) - .03, sdB(x, y, kx + .3, ky, .18, .022), sdB(x, y, kx + .41, ky + .055, .022, .035), sdB(x, y, kx + .32, ky + .05, .018, .03));
      if (key < .012) v = -1;
      return v;
    },
    exploitStamps(t) { return t > 2.1 ? [{ s: decode('credentials accepted', t, 2.1), x: .52, y: .68, acc: 1 }] : []; },

    report(x, y, t) { const o = 1 - ease(t / .8), L = lock(x, y, -.55, 0, o); return ink(L.d, x, y, t, .45); },
    reportStamps(t) {

      return L.filter((_, k) => t > .9 + k * .55).map((s, k) => ({ s: decode(s, t, .9 + k * .55), x: .38, y: -.3 + k * .2, acc: 1, left: 1 }));

    // Look-alike login page (case slide): window assembles, a countdown ticks, the password field types itself, the button fires.
    phish(x, y, t, i, j) {
      if (t < 1.2 && hash(i, j) > t / 1.1) return 0;
      const tl = t % 6.5, WX = .95, WY = .72, cy = .08;
      let v = 0;
      if (Math.abs(sdB(x, y, 0, cy, WX, WY, .04)) < .028) v = 1;
      else if (Math.abs(y - (cy - WY + .2)) < .012 && Math.abs(x) < WX) v = .55;

      for (let k = 0; k < n; k++) if (sdC(x, y, -.33 + k * .065, .24, .017) < .012) v = Math.max(v, 1);

    },
    phishStamps(t) {
      const tl = t % 6.5, URL = 'https://meridian-logistlcs.example/login', rem = Math.max(0, 7200 - Math.floor(t * 55) % 7200);
      const hh = String(Math.floor(rem / 3600)).padStart(2, '0'), mm = String(Math.floor(rem % 3600 / 60)).padStart(2, '0'), ss = String(rem % 60).padStart(2, '0');
      return [
        { s: 'sign in · it help desk', x: .12, y: -.54 },
        { s: URL, x: 0, y: -.34, hi: URL.indexOf('logistl') + 6 },
        { s: `password expires in ${hh}:${mm}:${ss}`, x: 0, y: -.21, acc: 1 },
        { s: 'username', x: -.4, y: -.1, left: 1 }, { s: 'sam@meridian.example', x: -.37, y: 0, left: 1 },
        { s: 'password', x: -.4, y: .14, left: 1 },
        { s: 'confirm password', x: 0, y: .52, acc: tl > 4.7 && tl < 5.7 }

    },

    defense(x, y, t, i, j, S) {
      const P = 2.6, u = (t % P) / P, ex = -1.05 + u * 1.85, ey = -.02, wallX = .02;
      const tw = S.verify ? ease((performance.now() / 1000 - S.verifyAt) / .6) : 0;
      let v = 0;
      if (tw > 0 && Math.abs(x - wallX) < .05 && y > .85 - tw * 1.75) v = (hash(Math.floor(y * 9), Math.floor(x * 30)) > .15) ? .9 : .5;
      const blocked = S.verify && ex > wallX - .24;
      if (!blocked) {
        const env = sdB(x, y, ex, ey, .17, .11, .015);
        if (Math.abs(env) < .024 || sdS(x, y, ex - .17, ey - .11, ex, ey + .02) < .017 || sdS(x, y, ex + .17, ey - .11, ex, ey + .02) < .017) v = 1;
      } else {
        const since = (ex - (wallX - .24)) / 1.85 * P, rr = since * .9, dd = Math.hypot(x - (wallX - .1), y - ey);
        if (Math.abs(dd - rr) < .07 && hash(i, j) > .72 && x < wallX) v = Math.max(v, .9 * cl(1 - since / .8));
      }
      const open = !S.verify && u > .8 ? ease((u - .8) / .08) : 0, L = lock(x, y, .72, -.02, open);
      const lv = ink(L.d, x, y, t, .3);
      if (lv) v = Math.max(Math.abs(v), lv) * (open > .5 ? -1 : 1);
      return v;
    },
    defenseStamps(t, S) {
      const u = (t % 2.6) / 2.6;
      return S.verify ? [{ s: 'call-back: request denied', x: .1, y: -.7, acc: 1, left: 1 }] : (u > .82 ? [{ s: 'access granted', x: .72, y: .55, acc: 1 }] : []);
    }
  };
  const RECON = [[-.48, -.42, 'org chart'], [.55, -.18, 'website'], [-.2, .55, 'conference photo']];

  /* ───────── renderer ───────── */
  const A = { S: { verify: false, verifyAt: 0 }, stats: { glyphs: 0, fps: 0, cols: 0, rows: 0, scene: 'idle' } };
  let cv, ctx, cfg, W, H, cw, chh, cols, rows, raf, last = 0, tt = 0, prev = null;
  let cur = { name: 'idle', cx: .68, clip: 0, t0: performance.now() };
  const DUR = 950; // scene-to-scene dissolve, ms
  A.init = function (canvas, config) {
    cv = canvas; ctx = cv.getContext('2d');
    cfg = Object.assign({ font: 'monospace', cell: 1.25, ramp: ' .:-=+*#%@', fps: 24, bg: null, unit: .92, color: (a, acc) => acc ? '#fff' : `rgba(255,255,255,${a})`, print: 0, inset: [0, 0, 0] }, config);
    const go = () => { resize(); if (!reduced) loop(); else draw(cur.t0 + 4000); };
    addEventListener('resize', () => { resize(); if (reduced) draw(cur.t0 + 4000); });
    (document.fonts ? document.fonts.ready : Promise.resolve()).then(go);
  };
  function resize() {
    const r = cv.getBoundingClientRect(), dpr = devicePixelRatio || 1;
    W = r.width; H = r.height; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    chh = W * cfg.cell / 100; ctx.font = `${chh}px ${cfg.font}`; ctx.textBaseline = 'top';
    cw = ctx.measureText('M').width; cols = Math.ceil(W / cw); rows = Math.ceil(H / chh);
    A.stats.cols = cols; A.stats.rows = rows;
  }
  function loop() { raf = requestAnimationFrame(now => { loop(); if (now - last < 1000 / cfg.fps) return; A.stats.fps = Math.round(1000 / (now - last)); last = now; draw(now); }); }
  function draw(now) {
    ctx.clearRect(0, 0, W, H); if (cfg.bg) { ctx.fillStyle = cfg.bg; ctx.fillRect(0, 0, W, H); }
    let k = prev ? (now - tt) / DUR : 1; if (k >= 1) { prev = null; k = 1; }
    const t = (now - cur.t0) / 1000, tp = prev ? (now - prev.t0) / 1000 : 0;
    const fN = SCENES[cur.name] || SCENES.idle, fP = prev ? (SCENES[prev.name] || SCENES.idle) : null;
    const u = H / 2 * cfg.unit, oy = H / 2, oxN = W * cur.cx, oxP = prev ? W * prev.cx : 0, ramp = cfg.ramp, n = ramp.length;
    const iN = Math.floor(cur.clip * W / cw), iP = prev ? Math.floor(prev.clip * W / cw) : cols, i0 = Math.min(iN, iP);

    let lastFill = '', glyphs = 0;
    const j0 = Math.ceil(cfg.inset[0] * rows), j1 = Math.floor((1 - cfg.inset[1]) * rows), i1 = Math.floor((1 - cfg.inset[2]) * cols);

          if (e <= 0) useNew = false;

  /* ───────── deck ───────── */
  const D = { slides: [], i: 0, step: 0 };
  D.init = function () {

    D.slides.forEach(s => s.querySelectorAll('[data-type]').forEach(e => e.dataset.full = e.textContent));
    const m = location.hash.match(/#(\d+)(?:\.(\d+))?/);
