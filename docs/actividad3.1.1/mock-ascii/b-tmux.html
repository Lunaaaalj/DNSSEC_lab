<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>B · tmux session</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="deck.css">
<style>
:root{--bg:#1d2021;--bg2:#282828;--bar:#3c3836;--fg:#ebdbb2;--dim:#a89984;--or:#fe8019;--aq:#8ec07c;--ye:#fabd2f}
body{background:#111;color:var(--fg);font-family:"JetBrains Mono",monospace}
#stage{background:var(--bg)}
::selection{background:var(--ye);color:var(--bg)}
:focus-visible{outline:.2cqw solid var(--ye);outline-offset:.2cqw}
#split{position:absolute;left:44cqw;top:0;bottom:2.6cqw;width:0;border-left:.15cqw solid var(--aq);z-index:2}
#pane{position:absolute;left:45cqw;top:.6cqw;font-size:1.15cqw;color:var(--dim);z-index:2}
#pane b{color:var(--aq);font-weight:400}
#status{position:absolute;left:0;right:0;bottom:0;height:2.6cqw;background:var(--bar);display:flex;align-items:center;gap:1.2cqw;padding:0 1.2cqw;font-size:1.2cqw;z-index:3}
#status .sess{background:var(--aq);color:var(--bg);padding:0 .8cqw;font-weight:700}
#status [data-tab]{color:var(--dim);cursor:pointer}#status [data-tab].on{color:var(--fg);font-weight:700}#status [data-tab].on::after{content:"*";color:var(--or)}
#status .r{margin-left:auto;color:var(--dim)}
.cmd{position:absolute;left:3cqw;top:2.6cqw;font-size:1.5cqw;color:var(--fg)}
.cmd::before{content:"sam@lab:~$ ";color:var(--aq);font-weight:700}
.cmd::after{content:"▊";color:var(--or);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.s-cover h1{position:absolute;left:3cqw;top:10cqw;font:800 7.4cqw/.92 "JetBrains Mono",monospace;letter-spacing:-.05em;color:var(--fg)}
.s-cover h1::first-line{color:var(--or)}
.s-cover .sub{position:absolute;left:3cqw;top:29cqw;width:36cqw;font-size:1.9cqw;line-height:1.4;color:var(--dim)}
.s-cover .foot{position:absolute;left:3cqw;bottom:5cqw;font-size:1.3cqw;color:var(--dim)}
.hd{position:absolute;left:3cqw;top:7cqw;width:38cqw;font:800 3.4cqw/1.05 "JetBrains Mono",monospace;letter-spacing:-.04em;text-wrap:balance}
.hd::before{content:"# ";color:var(--or)}
.keys{position:absolute;left:3cqw;top:19cqw;display:grid;gap:.5cqw;font-size:1.75cqw}
.keys li{color:var(--dim);opacity:.6;white-space:pre}.keys li.lit{opacity:1}.keys li.on{color:var(--fg)}
.keys li::before{content:"  "}.keys li.on::before{content:"▸ ";color:var(--or)}
.keys b{color:var(--ye);font-weight:700;margin-right:1cqw}
.caps{position:absolute;left:3cqw;bottom:5cqw;width:38cqw;height:10cqw}
.cap{position:absolute;inset:0;font-size:1.6cqw;line-height:1.5;color:var(--fg)}
.mail{position:absolute;left:3cqw;top:16cqw;width:39cqw;font-size:1.35cqw;line-height:1.55;background:var(--bg2);padding:1.4cqw 1.6cqw}
.mh b{color:var(--aq);font-weight:700}.mb{margin-top:.9cqw}
.hl{transition:background .3s,color .3s}.hl.on{background:var(--or);color:var(--bg)}
.btn{display:inline-block;border:.12cqw solid var(--dim);padding:.1cqw 1cqw}
.anns{position:absolute;left:3cqw;top:38cqw;width:39cqw;height:7cqw}
.ann{position:absolute;inset:0;font-size:1.5cqw;line-height:1.5}.ann b{color:var(--or)}
.seal{position:absolute;left:3cqw;bottom:4.2cqw;font-size:1.1cqw;color:var(--dim)}
#verify{position:absolute;left:3cqw;top:20cqw;background:var(--bar);color:var(--fg);border:0;padding:.7cqw 1.6cqw;font-size:1.7cqw;font-weight:700}
#verify[aria-pressed="true"]{background:var(--aq);color:var(--bg)}
.status{position:absolute;left:3cqw;top:27cqw;width:37cqw;font-size:1.7cqw;line-height:1.5}
</style></head>
<body>
<div id="stage"><canvas id="ascii" aria-hidden="true"></canvas><div id="split"></div><div id="pane">─ <b id="pn">ascii</b> ─</div><div id="slides"></div>
<div id="status"><span class="sess">act-3.1.1</span><span data-tab="0">0:cover</span><span data-tab="1">1:phases</span><span data-tab="2">2:case</span><span data-tab="3">3:defense</span><span class="r">synthetic lab · authorized</span></div></div>
<div id="notes"></div>
<script src="term.js"></script><script src="content.js"></script>
<script>
const lv=['#665c54','#7c6f64','#928374','#a89984','#d5c4a1','#ebdbb2'];
Ascii.init(document.getElementById('ascii'),{font:'"JetBrains Mono",monospace',cell:1.2,ramp:' ·:;+=xX$&',color:(a,acc)=>acc?'#fe8019':lv[Math.min(5,Math.floor(a*6))]});
document.addEventListener('deckchange',e=>{const s=Deck.slides[e.detail.slide];document.getElementById('pn').textContent='ascii:'+(s.dataset.scenes?s.dataset.scenes.split(',')[e.detail.step]:s.dataset.scene);});
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>Deck.go(+b.dataset.tab));
Deck.init();
</script>
</body></html>
