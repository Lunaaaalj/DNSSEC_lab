<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>C · ANSI BBS</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sixtyfour&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="deck.css">
<style>
:root{--bl:#0000aa;--bb:#5555ff;--cy:#55ffff;--mg:#ff55ff;--ye:#ffff55;--wh:#fff;--gy:#aaaaaa}
body{background:#000;color:var(--wh);font-family:"VT323",monospace}
#stage{background:#000}
::selection{background:var(--mg);color:#000}
:focus-visible{outline:.3cqw solid var(--ye)}
#top{position:absolute;left:0;right:0;top:0;height:3.4cqw;background:var(--bl);display:flex;justify-content:space-between;align-items:center;padding:0 1.6cqw;font-size:2.3cqw;z-index:3}
#top b{font-weight:400;color:var(--ye)}#top span{color:var(--cy)}
#bot{position:absolute;left:0;right:0;bottom:0;height:3cqw;display:flex;gap:2cqw;align-items:center;padding:0 1.6cqw;font-size:2cqw;color:var(--gy);z-index:3;border-top:.3cqw double var(--bb);background:#000}
#bot i{font-style:normal;color:#000;background:var(--cy);padding:0 .6cqw}
.frame{position:absolute;left:2cqw;top:5cqw;width:41cqw;bottom:4.6cqw;border:.5cqw double var(--cy);background:#000c;z-index:1}
.slide{z-index:2}
.cmd{position:absolute;left:4cqw;top:6.6cqw;font-size:2cqw;color:var(--mg)}.cmd::before{content:"C:\\> ";color:var(--gy)}
.s-cover h1{position:absolute;left:4cqw;top:12cqw;font:400 4.6cqw/1.15 "Sixtyfour",monospace;color:var(--ye);text-shadow:.35cqw .35cqw 0 var(--mg);text-transform:uppercase}
.s-cover .sub{position:absolute;left:4cqw;top:30cqw;width:36cqw;font-size:2.7cqw;line-height:1.05;color:var(--cy)}
.s-cover .foot{position:absolute;left:4cqw;bottom:7cqw;font-size:2.1cqw;color:var(--gy)}
.hd{position:absolute;left:4cqw;top:10.4cqw;width:37cqw;font:400 2.3cqw/1.3 "Sixtyfour",monospace;color:var(--ye);text-transform:uppercase}
.keys{position:absolute;left:4cqw;top:21cqw;display:grid;font-size:2.7cqw}
.keys li{color:var(--gy)}.keys li.lit{color:var(--wh)}.keys li.on{background:var(--mg);color:#000}
.keys b{font-weight:400;color:var(--ye)}.keys li.on b{color:#000}.keys b::before{content:"["}.keys b::after{content:"] "}
.caps{position:absolute;left:4cqw;bottom:7cqw;width:37cqw;height:9cqw}
.cap{position:absolute;inset:0;font-size:2.4cqw;line-height:1.05;color:var(--cy)}
.mail{position:absolute;left:4cqw;top:17.4cqw;width:37cqw;font-size:2.05cqw;line-height:1.05;background:var(--bl);padding:1cqw 1.4cqw;border:.3cqw solid var(--bb)}
.mh b{font-weight:400;color:var(--ye)}.mb{margin-top:.8cqw;color:var(--wh)}
.hl.on{background:var(--mg);color:#000}
.btn{display:inline-block;background:var(--gy);color:#000;padding:0 1cqw}
.anns{position:absolute;left:4cqw;top:38.6cqw;width:37cqw;height:5cqw}
.ann{position:absolute;inset:0;font-size:2.15cqw;line-height:1.05;color:var(--cy)}.ann b{font-weight:400;color:var(--ye)}
.seal{position:absolute;left:4cqw;bottom:6.2cqw;font-size:1.75cqw;color:var(--mg);width:37cqw}
#verify{position:absolute;left:4cqw;top:21cqw;background:var(--gy);color:#000;border:0;padding:0 1.4cqw;font-size:3cqw;text-transform:uppercase}
#verify[aria-pressed="true"]{background:var(--ye)}
.status{position:absolute;left:4cqw;top:28cqw;width:36cqw;font-size:2.5cqw;line-height:1.05;color:var(--cy)}
</style></head>
<body>
<div id="stage"><canvas id="ascii" aria-hidden="true"></canvas>
<div id="top"><b>▓▒░ MERIDIAN BBS ░▒▓</b><span>node 1 · synthetic lab · 14400 baud</span></div>
<div class="frame"></div><div id="slides"></div>
<div id="bot"><span><i>←</i> <i>→</i> move</span><span><i>N</i> notes</span><span><i>F</i> fullscreen</span></div></div>
<div id="notes"></div>
<script src="term.js"></script><script src="content.js"></script>
<script>
const ramp=['#0000aa','#5555ff','#55ffff','#ffffff'],cyc=['#ffff55','#ff55ff','#ff5555','#ffff55'];
Ascii.init(document.getElementById('ascii'),{font:'"VT323",monospace',cell:1.45,unit:.86,ramp:' ░▒▓█',color:(a,acc,t,i,j)=>acc?cyc[(Math.floor(t*8)+i+j)%4]:ramp[Math.min(3,Math.floor(a*4))]});
Deck.init();
</script>
</body></html>
