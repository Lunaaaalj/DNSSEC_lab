<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>B · Case file</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Special+Elite&display=swap" rel="stylesheet">
<link rel="stylesheet" href="deck.css">
<style>
:root{--veil:#d2a246;--bg:#d2a246;--ink:#121212;--string:#7d0f0b;--sheet:#f3e7c4;--soft:#5a4410}
body{background:#3a2c0a;color:var(--ink);font-family:"Special Elite",monospace}
#stage{background:var(--bg)}
::selection{background:var(--ink);color:var(--bg)}
:focus-visible{outline:.25cqw solid var(--ink);outline-offset:.3cqw}
.hull{fill:none;stroke:var(--ink);stroke-width:3;stroke-dasharray:18 12}
.hull-lbl{fill:var(--ink);font:400 32px "Special Elite",monospace}
.edge{fill:none;stroke:#12121255;stroke-width:3;transition:stroke .5s,stroke-width .5s}
.edge.lit{stroke:var(--string);stroke-width:7}
.edge.leak.lit{stroke:var(--string);stroke-width:4;stroke-dasharray:10 10}
.edge.active{stroke:var(--string);stroke-width:8;stroke-dasharray:60 22;animation:flow 1.3s linear infinite}
.edge.blocked{stroke:var(--ink);stroke-width:5;stroke-dasharray:5 15}
@keyframes flow{to{stroke-dashoffset:-82}}
.body{fill:var(--sheet);stroke:var(--ink);stroke-width:4;transition:fill .4s}
.hole{fill:var(--ink)}.node.source .hole,.node.tester .hole{fill:var(--string)}
.lbl{fill:var(--ink);font:400 34px "Special Elite",monospace;paint-order:stroke;stroke:var(--bg);stroke-width:9px}
.node.imp .body{fill:var(--ink)}.node.imp .hole{fill:var(--sheet)}
.node.pwned .body{fill:var(--string)}.node.pwned .hole{fill:var(--sheet)}
.node:not(.lit):not(.known):not(.imp):not(.pwned):not(.safe) .lbl{fill:var(--soft)}
.gate{opacity:0;transition:opacity .5s}.gate.show{opacity:1}
.gate-bar{fill:var(--ink)}.gate-lbl{fill:var(--ink);font:400 32px "Special Elite",monospace;paint-order:stroke;stroke:var(--bg);stroke-width:9px}
.s-cover{background:linear-gradient(90deg,#d2a246fa 0,#d2a246ee 42%,#d2a24600 72%)}
.blk{position:absolute;left:5.5cqw;top:50%;transform:translateY(-52%);width:46cqw}
.s-cover h1{font:900 11cqw/.84 "Big Shoulders Display",sans-serif;text-transform:uppercase}
.sub{font:400 2.1cqw/1.4 "Special Elite",monospace;margin-top:2.4cqw;max-width:30ch}
.foot{font:400 1.4cqw "Special Elite",monospace;margin-top:4cqw}
.hd{position:absolute;left:5.5cqw;top:4.5cqw;width:34cqw;font:900 5cqw/.9 "Big Shoulders Display",sans-serif;text-transform:uppercase;text-wrap:balance}
.keys{position:absolute;left:5.5cqw;top:19cqw;display:grid;gap:.6cqw;width:30cqw}
.keys li{display:grid;grid-template-columns:3.2cqw 1fr;align-items:baseline;border-top:.18cqw solid var(--ink);padding-top:.7cqw;opacity:.5;transition:opacity .4s}
.keys li.lit{opacity:1}.keys b{font:900 2.6cqw/1 "Big Shoulders Display",sans-serif}
.keys span{font:900 2.3cqw/1 "Big Shoulders Display",sans-serif;text-transform:uppercase;letter-spacing:.02em}
.caps{position:absolute;left:5.5cqw;bottom:4.5cqw;width:31cqw;height:11cqw}
.cap{position:absolute;inset:0;font:400 1.5cqw/1.5 "Special Elite",monospace}
.cap b{display:block;font:900 2.4cqw/1 "Big Shoulders Display",sans-serif;text-transform:uppercase;margin-bottom:.6cqw}
.mail{position:absolute;left:5.5cqw;top:19cqw;width:34cqw;background:var(--sheet);padding:2cqw 2.4cqw;transform:rotate(-1.1deg);box-shadow:0 .8cqw 1.8cqw -.5cqw #0007;font:400 1.22cqw/1.5 "Special Elite",monospace}
.mail p+p{margin-top:.6cqw}.mh b{display:inline-block;width:6cqw}.mb{margin-top:1.3cqw!important}
.hl{background:var(--ink);color:var(--ink);padding:0 .3cqw;transition:background .5s,color .5s}
.hl.on{background:#7d0f0b33;color:var(--ink)}
.btn{display:inline-block;border:.2cqw solid var(--ink);padding:.5cqw 1.5cqw}
.anns{position:absolute;left:5.5cqw;top:45cqw;width:34cqw;height:6cqw}
.ann{position:absolute;inset:0;font:400 1.45cqw/1.5 "Special Elite",monospace}.ann b{font-weight:400;text-decoration:underline;text-underline-offset:.3cqw}
.seal{position:absolute;right:5.5cqw;bottom:3.4cqw;transform:rotate(-4deg);border:.35cqw solid var(--string);color:var(--string);padding:.7cqw 1.4cqw;font:400 1.3cqw/1.2 "Special Elite",monospace;text-transform:uppercase;max-width:34cqw;text-align:center;mix-blend-mode:multiply}
#verify{position:absolute;left:5.5cqw;top:20.5cqw;background:var(--ink);color:var(--bg);border:0;padding:1cqw 2.2cqw;font:900 2.2cqw/1 "Big Shoulders Display",sans-serif;text-transform:uppercase;letter-spacing:.03em}
#verify[aria-pressed="true"]{background:var(--string);color:#fff}
.status{position:absolute;left:5.5cqw;top:28.5cqw;width:31cqw;font:400 1.55cqw/1.5 "Special Elite",monospace}
#prog{position:absolute;right:2cqw;top:50%;transform:translateY(-50%);display:grid;gap:1cqw}
#prog i{width:1cqw;height:1cqw;background:#12121255;cursor:pointer}#prog i.on{background:var(--ink)}
</style></head>
<body>
<div id="stage"><svg class="world" id="world" aria-label="Trust graph of a fictional company"></svg><div id="slides"></div><div id="prog"></div></div>
<div id="notes"></div><div id="hint">← → step · N notes · F fullscreen</div>
<script src="world.js"></script><script src="content.js"></script>
<script>World.init(document.getElementById('world'),{shape:'square',curve:0});Deck.init();</script>
</body></html>
