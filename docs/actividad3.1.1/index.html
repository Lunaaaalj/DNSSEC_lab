<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Activity 3.1.1 · Social engineering with SET</title>
<meta name="description" content="Terminal-HUD slide deck on social-engineering pentesting methods and the Social-Engineer Toolkit. Authorized, synthetic scenarios.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="deck.css">
<style>
:root{--bg:#0b0c0d;--ink:#e6e8e3;--mid:#9ea29c;--dim:#83877f;--line:#e6e8e32e;--line2:#e6e8e35c;--amb:#ffb000}
body{background:#050506;color:var(--ink);font-family:"Geist Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
#stage{background:var(--bg)}
::selection{background:var(--ink);color:var(--bg)}
:focus-visible{outline:.15cqw solid var(--ink);outline-offset:.3cqw}

/* ── HUD chrome ── */
#hud{position:absolute;inset:0;pointer-events:none;z-index:4;font-size:1.05cqw;letter-spacing:.06em;text-transform:uppercase;color:var(--mid)}
.frame{position:absolute;inset:1.6cqw;border:.07cqw solid var(--line)}
.cn{position:absolute;width:2.6cqw;height:2.6cqw;border:0 solid var(--ink)}
.cn.tl{left:1.6cqw;top:1.6cqw;border-width:.16cqw 0 0 .16cqw}.cn.tr{right:1.6cqw;top:1.6cqw;border-width:.16cqw .16cqw 0 0}
.cn.bl{left:1.6cqw;bottom:1.6cqw;border-width:0 0 .16cqw .16cqw}.cn.br{right:1.6cqw;bottom:1.6cqw;border-width:0 .16cqw .16cqw 0}
.ro{position:absolute;left:4.5cqw;right:4.5cqw;display:flex;justify-content:space-between;gap:2cqw}
.ro.top{top:2.5cqw}.ro.bot{bottom:2.4cqw}
.ro b{font-weight:500;color:var(--ink)}
.live{color:var(--ink)}.live::before{content:"";display:inline-block;width:.6cqw;height:.6cqw;border-radius:50%;background:var(--amb);margin-right:.7cqw;vertical-align:.05cqw;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.ruler{position:absolute;top:8cqw;bottom:8cqw;width:1cqw;background:repeating-linear-gradient(180deg,var(--line2) 0 .07cqw,transparent .07cqw 1.2cqw),repeating-linear-gradient(180deg,var(--ink) 0 .1cqw,transparent .1cqw 6cqw)}
.ruler.l{left:1.6cqw;background-size:.55cqw 100%,1cqw 100%;background-repeat:no-repeat}
.ruler.r{right:1.6cqw;background-size:.55cqw 100%,1cqw 100%;background-repeat:no-repeat;background-position:right top,right top}
.ret{position:absolute;left:47cqw;right:4.5cqw;top:7.2cqw;bottom:6.6cqw;transition:left .55s cubic-bezier(.16,1,.3,1)}
body[data-slide="5"] .ret{left:65cqw}
.ret i{position:absolute;width:1.4cqw;height:1.4cqw;border:0 solid var(--line2)}
.ret i:nth-child(1){left:0;top:0;border-width:.1cqw 0 0 .1cqw}.ret i:nth-child(2){right:0;top:0;border-width:.1cqw .1cqw 0 0}
.ret i:nth-child(3){left:0;bottom:0;border-width:0 0 .1cqw .1cqw}.ret i:nth-child(4){right:0;bottom:0;border-width:0 .1cqw .1cqw 0}
.ret .lab{position:absolute;left:2cqw;top:-.55cqw;background:var(--bg);padding:0 .6cqw;color:var(--dim)}
.ret .scan{position:absolute;left:0;right:0;height:.07cqw;background:linear-gradient(90deg,transparent,var(--line2) 20%,var(--line2) 80%,transparent);animation:scan 7s linear infinite}
@keyframes scan{from{top:0}to{top:100%}}
.ret .xh{position:absolute;left:50%;top:50%;width:1.6cqw;height:1.6cqw;translate:-50% -50%;background:linear-gradient(var(--line2),var(--line2)) center/100% .07cqw no-repeat,linear-gradient(var(--line2),var(--line2)) center/.07cqw 100% no-repeat}
.meter{position:absolute;left:4.5cqw;bottom:5.2cqw;width:37cqw;height:.3cqw;display:flex;gap:.4cqw}
.meter span{flex:1;background:var(--line);transition:background .4s}.meter span.on{background:var(--ink)}

/* ── shared slide content ── */
.cmd{position:absolute;left:4.5cqw;top:6.4cqw;font-size:1.15cqw;letter-spacing:.06em;color:var(--dim);text-transform:uppercase}
.cmd::before{content:"cmd ";color:var(--mid)}.cmd::after{content:"_";color:var(--amb);animation:pulse 1.1s steps(1) infinite}
.hd{position:absolute;left:4.5cqw;top:9.6cqw;width:38cqw;font:500 3.3cqw/1.02 "Geist Mono",monospace;text-transform:uppercase;letter-spacing:-.04em;text-wrap:balance}
.seal{position:absolute;left:4.5cqw;bottom:7cqw;font-size:1cqw;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);max-width:40cqw}

/* cover */
.s-cover h1{position:absolute;left:4.5cqw;top:10.4cqw;font:500 4.9cqw/.94 "Geist Mono",monospace;text-transform:uppercase;letter-spacing:-.045em}
.s-cover .sub{position:absolute;left:4.5cqw;top:25.4cqw;width:36cqw;font:300 1.6cqw/1.45 "Geist Mono",monospace;color:var(--mid)}
.s-cover .foot{position:absolute;left:4.5cqw;bottom:7cqw;width:38cqw;line-height:1.5;font-size:1cqw;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.team{position:absolute;left:4.5cqw;bottom:12.6cqw;width:36cqw;display:grid;border-top:.07cqw solid var(--line2)}
.s-cover .foot span{display:block;margin-bottom:.3cqw;font-size:1.15cqw;color:var(--ink)}
.team li{display:flex;justify-content:space-between;gap:2cqw;padding:.42cqw 0;border-bottom:.07cqw solid var(--line);font:300 1.22cqw/1.2 "Geist Mono",monospace;color:var(--ink)}
.team i{font:400 1.12cqw/1.2 "Geist Mono",monospace;font-style:normal;letter-spacing:.06em;color:var(--mid)}

/* method — phase list */
.keys{position:absolute;left:4.5cqw;top:20cqw;width:37cqw;display:grid;font-size:1.45cqw;letter-spacing:.04em;text-transform:uppercase}
.keys li{display:grid;grid-template-columns:3.4cqw 1fr auto;align-items:center;padding:.55cqw .8cqw;margin:0 -.8cqw;border-top:.07cqw solid var(--line);color:var(--dim);transition:background .4s,color .4s}
.keys li:last-child{border-bottom:.07cqw solid var(--line)}
.keys li.lit{color:var(--mid)}.keys li.on{background:var(--ink);color:var(--bg)}
.keys b{font-weight:500}.keys b::before{content:"P"}
.keys li::after{content:"--";font-size:1.05cqw;letter-spacing:.08em}
.keys li.lit::after{content:"done"}.keys li.on::after{content:"live"}
.caps{position:absolute;left:4.5cqw;bottom:7.6cqw;width:36cqw;height:8.6cqw}
.cap{position:absolute;inset:0;font:300 1.6cqw/1.5 "Geist Mono",monospace}

/* tool — definition + facts */
.lede{position:absolute;left:4.5cqw;top:16.8cqw;width:39cqw;font:300 1.58cqw/1.46 "Geist Mono",monospace;color:var(--mid)}
.lede b{font-weight:500;color:var(--ink)}
.facts{position:absolute;left:4.5cqw;top:32cqw;width:39cqw;display:grid;gap:1cqw}
.facts li{position:relative;padding-left:2.2cqw;font:300 1.42cqw/1.4 "Geist Mono",monospace}
.facts li::before{content:"›";position:absolute;left:0;top:0;color:var(--amb);font-weight:500}
.facts b{font-weight:500;color:var(--ink)}

/* vectors — numbered rows */
.rows{position:absolute;left:4.5cqw;top:17.5cqw;width:39cqw;display:grid}
.rows li{display:grid;grid-template-columns:4.4cqw 1fr;align-items:start;gap:1cqw;padding:1.15cqw .8cqw;margin:0 -.8cqw;border-top:.07cqw solid var(--line);opacity:.4;transition:opacity .45s,background .45s}
.rows li:last-child{border-bottom:.07cqw solid var(--line)}
.rows li.lit{opacity:1}
.rows b{font:500 2.4cqw/1 "Geist Mono",monospace;color:var(--amb);letter-spacing:-.03em}
.rows strong{display:block;font:500 1.6cqw/1.1 "Geist Mono",monospace;text-transform:uppercase;letter-spacing:.01em;margin-bottom:.35cqw}
.rows span{font:300 1.35cqw/1.4 "Geist Mono",monospace;color:var(--mid)}

/* case — intercepted mail */
.mail{position:absolute;left:4.5cqw;top:17.8cqw;width:38cqw;border:.07cqw solid var(--line2);background:var(--bg);padding:1.3cqw 1.6cqw 1.5cqw;font:300 1.28cqw/1.6 "Geist Mono",monospace}
.mail::before{content:"intercept · phish-001.eml · synthetic";display:block;font:400 .95cqw/1 "Geist Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-bottom:1cqw}
.mh b{font-weight:500;color:var(--mid);display:inline-block;width:6.4cqw}.mb{margin-top:.8cqw}
.hl{padding:0 .2cqw;transition:background .35s,color .35s}.hl.on{background:var(--ink);color:var(--bg)}
.btn{display:inline-block;border:.07cqw solid var(--line2);padding:.1cqw 1.2cqw}
.anns{position:absolute;left:4.5cqw;top:41.6cqw;width:38cqw;height:5.6cqw}
.ann{position:absolute;inset:0;font:300 1.45cqw/1.5 "Geist Mono",monospace}.ann b{font-weight:500}

/* real — two columns */
.cols{position:absolute;left:4.5cqw;top:17cqw;width:56cqw;display:grid;grid-template-columns:1fr 1fr;gap:3cqw}
.col{border-top:.1cqw solid var(--line2);padding-top:1cqw}
.col-h{font:500 1.5cqw/1.15 "Geist Mono",monospace;text-transform:uppercase;letter-spacing:.01em}
.col-h span{display:block;font:300 1.1cqw/1.2 "Geist Mono",monospace;text-transform:none;color:var(--mid);margin-top:.3cqw}
.mini{margin-top:1.2cqw;display:grid;gap:.85cqw;counter-reset:m}
.mini li{position:relative;padding-left:2.4cqw;font:300 1.35cqw/1.38 "Geist Mono",monospace;counter-increment:m}
.mini li::before{content:counter(m,decimal-leading-zero);position:absolute;left:0;top:.05cqw;font-size:1.05cqw;color:var(--dim)}
.col-f{margin-top:1.3cqw;font:400 1.05cqw/1.2 "Geist Mono",monospace;letter-spacing:.05em;text-transform:uppercase;color:var(--amb)}
.s-real .seal{bottom:5.4cqw}

/* defense */
#verify{position:absolute;left:4.5cqw;top:20cqw;background:none;color:var(--ink);border:.1cqw solid var(--ink);padding:.8cqw 1.6cqw;font:500 1.45cqw/1 "Geist Mono",monospace;letter-spacing:.06em;text-transform:uppercase;transition:background .3s,color .3s}
#verify:hover{background:#e6e8e31a}
#verify[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.status{position:absolute;left:4.5cqw;top:26.4cqw;width:35cqw;font:300 1.7cqw/1.5 "Geist Mono",monospace}

/* references */
.refs{position:absolute;left:4.5cqw;top:17.5cqw;width:52cqw;display:grid;gap:1.6cqw;counter-reset:r}
.refs li{position:relative;padding:.9cqw 0 0 3.2cqw;border-top:.07cqw solid var(--line);font:300 1.38cqw/1.5 "Geist Mono",monospace;color:var(--mid);counter-increment:r;overflow-wrap:anywhere}
.refs li::before{content:counter(r,decimal-leading-zero);position:absolute;left:0;top:.95cqw;font-size:1.05cqw;color:var(--amb);font-weight:500}
.refs i{font-style:italic;color:var(--ink)}
.refs a{color:var(--ink);text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:.3cqw;transition:text-decoration-color .3s}
.refs a:hover,.refs a:focus-visible{text-decoration-color:var(--amb)}

/* ethics */
.rules{position:absolute;left:4.5cqw;top:18.5cqw;width:39cqw;display:grid}
.rules li{position:relative;padding:1.3cqw .8cqw 1.3cqw 3.4cqw;margin:0 -.8cqw;border-top:.07cqw solid var(--line);font:300 1.6cqw/1.4 "Geist Mono",monospace}
.rules li:last-child{border-bottom:.07cqw solid var(--line)}
.rules li::before{content:"[x]";position:absolute;left:.4cqw;top:1.3cqw;color:var(--amb);font-weight:500}
.rules b{font-weight:500;color:var(--ink)}
</style></head>
<body>
<div id="stage">
  <canvas id="ascii" aria-hidden="true"></canvas>
  <div id="slides"></div>
  <div id="hud" aria-hidden="true">
    <div class="frame"></div><i class="cn tl"></i><i class="cn tr"></i><i class="cn bl"></i><i class="cn br"></i>
    <div class="ruler l"></div><div class="ruler r"></div>
    <div class="ro top"><span><b>act 3.1.1</b> / social engineering · set</span><span id="ro-pos">slide 01/09</span><span id="ro-t" class="live">t+00:00.0</span></div>
    <div class="ret"><i></i><i></i><i></i><i></i><span class="lab" id="ro-scn">view · cover</span><div class="scan"></div><div class="xh"></div></div>
    <div class="meter" id="meter"></div>
    <div class="ro bot"><span id="ro-stats">fps -- · glyphs ---- · grid ---×--</span><span>synthetic data · authorized exercise</span></div>
  </div>
</div>
<div id="notes"></div>
<script src="term.js"></script><script src="content.js"></script>
<script>
const lv=['#3c3f3c','#555955','#737872','#949993','#bfc3bc','#e6e8e3'];
Ascii.init(document.getElementById('ascii'),{font:'"Geist Mono",monospace',cell:1.15,unit:.84,inset:[.14,.13,.035],ramp:' .:-=+*#%',color:(a,acc)=>acc?'#ffb000':lv[Math.min(5,Math.floor(a*6))]});
const slideCount=document.querySelectorAll('.slide').length,meter=document.getElementById('meter');
for(let k=0;k<slideCount;k++)meter.appendChild(document.createElement('span'));
let since=performance.now();const pad=(n,w)=>String(n).padStart(w,'0');
document.addEventListener('deckchange',e=>{
  const s=Deck.slides[e.detail.slide],n=+s.dataset.steps||0;since=performance.now();
  document.getElementById('ro-pos').textContent=`slide ${pad(e.detail.slide+1,2)}/${pad(Deck.slides.length,2)}`+(n?` · step ${e.detail.step}/${n}`:'');
  [...meter.children].forEach((m,k)=>m.classList.toggle('on',k<=e.detail.slide));
});
setInterval(()=>{
  const t=(performance.now()-since)/1000,S=Ascii.stats;
  document.getElementById('ro-t').textContent=`t+${pad(Math.floor(t/60),2)}:${pad(Math.floor(t%60),2)}.${Math.floor(t*10)%10}`;
  document.getElementById('ro-scn').textContent=`view · ${S.scene}`;
  document.getElementById('ro-stats').textContent=`fps ${pad(S.fps,2)} · glyphs ${pad(S.glyphs,4)} · grid ${S.cols}×${S.rows}`;
},100);
Deck.init();
</script>
</body></html>
